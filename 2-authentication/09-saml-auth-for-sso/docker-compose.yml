name: saml-for-sso

services:
  idp:
    image: kenchan0130/simplesamlphp:1.19.9
    ports:
      - 8080:8080
    environment:
      - SIMPLESAMLPHP_SP_ENTITY_ID=urn:example:sp 
      - SIMPLESAMLPHP_SP_ASSERTION_CONSUMER_SERVICE=http://localhost:3000/login/callback
      - SIMPLESAMLPHP_SP_SINGLE_LOGOUT_SERVICE=http://localhost:3000/logout/callback
  sp:
    image: node:26.5.0
    ports:
      - 3000:3000
    working_dir: /app
    command: sh -c "npm update && npm install @node-saml/node-saml && node app.js"
    volumes:
      - ./volumes/sp/app:/app
