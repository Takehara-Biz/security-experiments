name: S/Key

services:
  client:
    image: alpine/curl:8.21.0
    command: >
      sh -c "apk add --no-cache openssl && tail -f /dev/null"
    working_dir: /app
    tty: true
    volumes:
      - ./volumes/client/app:/app
  server:
    image: node:26.5.0
    working_dir: /app
    command: ["node", "app.js"]
    volumes:
      - ./volumes/server/app:/app
