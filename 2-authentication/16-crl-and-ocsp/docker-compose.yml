services:
  responder:
    image: alpine:3.23.5
    container_name: ocsp-responder
    working_dir: /app
    command: >
      sh -c "apk add --no-cache openssl && ls -l && ./remove-all-deliverables.sh &&
             ./setup_and_run.sh"
    volumes:
      - ./volumes/app:/app
    ports:
      - "8888:8888"

  client:
    image: alpine:3.23.5
    container_name: ocsp-client
    working_dir: /app
    depends_on:
      - responder
    command: >
      sh -c "apk add --no-cache openssl &&
             tail -f /dev/null"  # コンテナを起動し続ける
    volumes:
      - ./volumes/app:/app
