name: waf-lab

services:
  # --- 1. 脆弱性Webアプリ ---
  vulnerable-app:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop
    ports:
      - "3000:3000"

  # --- 2. WAF (OWASP ModSecurity / Nginx) ---
  waf:
    image: owasp/modsecurity-crs:nginx
    container_name: waf-proxy
    ports:
      - "80:8080"
    environment:
      - BACKEND=http://vulnerable-app:3000
      - PORT=8080
      - PARANOIA=1
      - SEC_RULE_ENGINE=On # Set to 'DetectionOnly' to log without blocking
    depends_on:
      - vulnerable-app
