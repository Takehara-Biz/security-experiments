name: ufw-firewall

services:
  # --- 1. Client コンテナ ---
  client:
    image: alpine:latest
    container_name: client
    working_dir: /app
    command: tail -f /dev/null
    networks:
      front-net:
        ipv4_address: 192.168.10.2
    # 起動時にデフォルトゲートウェイをFirewall(192.168.10.254)に変更
    cap_add:
      - NET_ADMIN
    entrypoint: >
      sh -c "
      apk add --no-cache curl bind-tools iproute2 &&
      ip route del default &&
      ip route add default via 192.168.10.254 &&
      tail -f /dev/null
      "
    volumes:
      - ./volumes/client/app:/app

  # --- 2. Firewall コンテナ ---
  firewall:
    build:
      dockerfile: ./Dockerfile-firewall
    container_name: firewall
    working_dir: /app
    # sysctlsでコンテナのIP Forwardingを有効化
    sysctls:
      - net.ipv4.ip_forward=1
    # パケットフィルタリングとルーティングに必要な権限を付与
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      front-net:
        ipv4_address: 192.168.10.254
      back-net:
        ipv4_address: 192.168.20.254
    volumes:
      - ./volumes/firewall/app:/app

  # --- 3. Server コンテナ (Webサーバー) ---
  server:
    image: nginx:alpine
    container_name: server
    working_dir: /app
    networks:
      back-net:
        ipv4_address: 192.168.20.2
    cap_add:
      - NET_ADMIN
    # 起動時にデフォルトゲートウェイをFirewall(192.168.20.254)に変更
    command: >
      sh -c "
      apk add --no-cache iproute2 &&
      ip route del default &&
      ip route add default via 192.168.20.254 &&
      nginx -g 'daemon off;'
      "

# --- ネットワーク定義 ---
networks:
  front-net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.10.0/24
  back-net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.20.0/24
